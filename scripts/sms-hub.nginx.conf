# 接码号码聚合 sms.jinzhai.icu —— 静态直出 + /api/ 反代短信渲染服务
server {
    listen 0.0.0.0:80;
    listen [::]:80;
    server_name sms.jinzhai.icu;

    # 仅用于签发证书的验证目录
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 0.0.0.0:443 ssl;
    listen [::]:443 ssl;
    server_name sms.jinzhai.icu;

    ssl_certificate /etc/letsencrypt/live/sms.jinzhai.icu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sms.jinzhai.icu/privkey.pem;

    # 基础安全响应头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    root /opt/sms-hub/web;
    index index.html;

    # 数据文件：浏览器 30 秒内可复用，但 Cloudflare 边缘一律不缓存。
    # 【为什么不用 no-cache】Cloudflare 对 `no-cache` 会直接 BYPASS，连边缘都不存；
    # 对动态数据我们要的正是「边缘不缓存、回源拿最新」，用 no-store + s-maxage=0 语义更准。
    location = /data/numbers.json {
        add_header Cache-Control "public, max-age=30, s-maxage=0, must-revalidate" always;
        add_header Access-Control-Allow-Origin "*" always;
    }

    # ---- 短信渲染服务反向代理 ----
    # 只反代到 127.0.0.1，公网无法直接访问后端端口。
    # 后端自身已做「同号码 15 秒限频 + 全局并发 2」，nginx 这层只做粗粒度防洪。
    location /api/ {
        limit_req zone=smsapi burst=10 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:18620;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";

        # 渲染需要真浏览器，冷启动可能到 15s，超时给到 40s
        proxy_connect_timeout 5s;
        proxy_send_timeout 40s;
        proxy_read_timeout 40s;

        # 接口响应一律不缓存（Cloudflare 也照此执行）
        proxy_buffering off;
        add_header Cache-Control "no-store" always;
    }

    # 后端健康检查不暴露给公网（只供本机监控）
    location = /healthz {
        return 404;
    }

    # ---- 去尾斜杠 301（防重复内容 + 防目录 403）----
    # 所有「干净 URL」一律以不带斜杠的形态作为 canonical：
    # /numbers/ -> /numbers、/country/ -> /country、/en/numbers/ -> /en/numbers 等。
    # 【为什么必须放在最前面】放在后面会被 `location /` 的目录匹配抢先，导致 403。
    # 【为什么用 301 而不是直接 200】同一个页面若两种 URL 都能 200，会被搜索引擎
    # 视为重复内容；统一 301 到唯一 URL，SEO 更干净。
    location ~ "^/(numbers|guide|faq|admin|country|en/number|en/numbers|en/guide|en/faq|en/country)/+$" {
        return 301 /$1;
    }

    # ---- 干净 URL 重写（§4 信息架构）----
    # 【重要】这些 exact location 在 try_files 重写后是「最终生效的 location」，
    # 其内部的 add_header 会覆盖外层 location 的 add_header（nginx 继承规则），
    # 因此必须在这里显式声明 Cache-Control，否则内部重写过来的 .html 会
    # 「一个 Cache-Control 都没有」→ Cloudflare 直接 cf-cache-status: BYPASS。
    # 用 s-maxage 让 Cloudflare 边缘缓存 1 小时，同时浏览器仍按 max-age=0
    # 每次回源校验 → 既拿到边缘缓存收益，又保证改版即时生效。
    location = /numbers {
        try_files /numbers.html =404;
        add_header Cache-Control "public, max-age=0, s-maxage=3600" always;
    }
    location = /guide {
        try_files /guide.html =404;
        add_header Cache-Control "public, max-age=0, s-maxage=3600" always;
    }
    location = /faq {
        try_files /faq.html =404;
        add_header Cache-Control "public, max-age=0, s-maxage=3600" always;
    }
    location = /admin { try_files /admin.html =404; }

    # ---- 英文版（/en/ 子目录，双语站）----
    # 静态文件（含 /en/xxx.html）直接由 root 命中，无需 rewrite。
    # 只需把「干净 URL」映射到 /en/*.html：

    # /en 与 /en/ -> /en/index.html
    # 【注意】`location = /en` 只精确匹配不带斜杠的 /en；/en/ 不带等号也命中不了
    # 精确匹配，会落到后面的 `location /en/`。但 /en/ 是英文首页最自然的写法
    # （也是 sitemap 与 hreflang 里写的形式），必须直接 200 而不是跳转。
    # 因此这里显式再加一条 /en/ 的规则，两者都直出 index.html。
    location = /en {
        try_files /en/index.html =404;
        add_header Cache-Control "public, max-age=0, s-maxage=3600" always;
    }
    location = /en/ {
        try_files /en/index.html =404;
        add_header Cache-Control "public, max-age=0, s-maxage=3600" always;
    }

    # /en/numbers、/en/guide、/en/faq、/en/country -> /en/xxx.html
    location = /en/numbers {
        try_files /en/numbers.html =404;
        add_header Cache-Control "public, max-age=0, s-maxage=3600" always;
    }
    location = /en/guide {
        try_files /en/guide.html =404;
        add_header Cache-Control "public, max-age=0, s-maxage=3600" always;
    }
    location = /en/faq {
        try_files /en/faq.html =404;
        add_header Cache-Control "public, max-age=0, s-maxage=3600" always;
    }
    location = /en/country {
        try_files /en/country.html =404;
        add_header Cache-Control "public, max-age=0, s-maxage=3600" always;
    }
    location = /en/country/ {
        try_files /en/country.html =404;
        add_header Cache-Control "public, max-age=0, s-maxage=3600" always;
    }

    # 英文国家页：优先直出预渲染 /en/country/us.html，找不到回落 JS 动态页
    location ~ "^/en/country/(?<ciso>[A-Za-z]+)/?$" {
        try_files /en/country/$ciso.html /en/country.html?c=$ciso =404;
        add_header Cache-Control "public, max-age=0, s-maxage=3600" always;
    }

    # 英文号码详情页：无静态版本，302 到 /en/number.html?id=xxx
    location ~ "^/en/number/(.+)$" {
        return 302 /en/number.html?id=$1;
    }
    location = /en/number {
        try_files /en/number.html =404;
        add_header Cache-Control "public, max-age=0, s-maxage=3600" always;
    }

    # /en/xxx 其它子路径：先找真实文件/目录，再回落 /en/index.html
    # 【注意】这里不能写 `$uri/`：/en/country/ 这类目录没有 index.html，
    # 命中目录后 nginx 会返回 403（且 autoindex 关闭）。只保留文件查找即可。
    location /en/ {
        try_files $uri /en/index.html;
    }

    # 国家列表页：/country 必须显式映射到 country.html。
    # 【踩坑】若不写这条，/country 会落到 `location /` 的 `try_files $uri $uri/`，
    # 其中 `$uri/` 命中真实存在的 /country/ 目录 → nginx 补斜杠 301 → /country/
    # 该目录无 index.html 且未开 autoindex → **403**。
    # 带斜杠的 /country/ 也要一并兜住，避免用户手敲斜杠后 403。
    location = /country {
        try_files /country.html =404;
        add_header Cache-Control "public, max-age=0, s-maxage=3600" always;
    }
    # 兜底：/country/ 直接出页面，而不是撞目录 403
    # （旧缓存/CDN/搜索引擎可能仍持有 /country/ 这个 URL）
    location = /country/ {
        try_files /country.html =404;
        add_header Cache-Control "public, max-age=0, s-maxage=3600" always;
    }
    # 国家页：优先直出预渲染静态页（/country/us -> /country/us.html）
    # 这是给 Google 抓的：正文、H1、号码列表全部在原始 HTML 源码里，无需执行 JS。
    # try_files 会先找 /country/us.html，找不到再找 /country/us/，最后回落到 JS 动态页。
    location ~ "^/country/(?<ciso>[A-Za-z]+)/?$" {
        try_files /country/$ciso.html /country.html?c=$ciso =404;
        add_header Cache-Control "public, max-age=0, s-maxage=3600" always;
    }

    # 号码详情页没有静态版本，保持动态
    location ~ "^/number/(.+)$" {
        return 302 /number.html?id=$1;
    }

    location / {
        # 只保留 `$uri`（文件查找）与 index.html 回落。
        # 【踩坑】不能写 `$uri/`：/country → 命中 /country/ 目录 → 301 → 目录无
        # index.html → 403。去掉 `$uri/` 后，未知路径统一回落 index.html（SPA 兜底）。
        try_files $uri /index.html;
        add_header Cache-Control "public, max-age=0, s-maxage=3600" always;
    }

    # HTML 短缓存：浏览器每次校验，边缘缓存 1 小时（改版后最多 1 小时生效）
    location ~* \.html$ {
        add_header Cache-Control "public, max-age=0, s-maxage=3600" always;
        etag on;
    }

    # 静态资源长缓存（哈希未变即无需回源；改版后见下方说明）
    location /assets/ {
        add_header Cache-Control "public, max-age=86400" always;
        access_log off;
    }

    # XML / TXT 站点文件：边缘缓存 1 小时
    location ~* \.(xml|txt)$ {
        add_header Cache-Control "public, max-age=0, s-maxage=3600" always;
    }

    access_log /var/log/nginx/sms-hub.access.log;
    error_log /var/log/nginx/sms-hub.error.log;
}
