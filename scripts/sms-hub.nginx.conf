# 接码号码聚合 sms.jinzhai.icu —— 纯静态直出
server {
    listen 0.0.0.0:80;
    listen [::]:80;
    server_name sms.jinzhai.icu;

    # 仅用于签发证书的验证目录
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 0.0.0.0:443 ssl;
    listen [::]:443 ssl;
    server_name sms.jinzhai.icu;

    ssl_certificate /etc/letsencrypt/live/sms.jinzhai.icu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sms.jinzhai.icu/privkey.pem;

    # 基础安全响应头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    root /opt/sms-hub/web;
    index index.html;

    # 数据文件：不缓存，保证每次刷新都能拿到最新
    location = /data/numbers.json {
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header Access-Control-Allow-Origin "*" always;
        expires -1;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # HTML 不缓存，改版即时生效
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
        expires -1;
    }

    access_log /var/log/nginx/sms-hub.access.log;
    error_log /var/log/nginx/sms-hub.error.log;
}
