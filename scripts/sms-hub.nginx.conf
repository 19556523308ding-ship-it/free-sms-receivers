# 接码号码聚合 sms.jinzhai.icu —— 静态直出 + /api/ 反代短信渲染服务
server {
    listen 0.0.0.0:80;
    listen [::]:80;
    server_name sms.jinzhai.icu;

    # 仅用于签发证书的验证目录
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 0.0.0.0:443 ssl;
    listen [::]:443 ssl;
    server_name sms.jinzhai.icu;

    ssl_certificate /etc/letsencrypt/live/sms.jinzhai.icu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sms.jinzhai.icu/privkey.pem;

    # 基础安全响应头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    root /opt/sms-hub/web;
    index index.html;

    # 数据文件：不缓存，保证每次刷新都能拿到最新
    location = /data/numbers.json {
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header Access-Control-Allow-Origin "*" always;
        expires -1;
    }

    # ---- 短信渲染服务反向代理 ----
    # 只反代到 127.0.0.1，公网无法直接访问后端端口。
    # 后端自身已做「同号码 15 秒限频 + 全局并发 2」，nginx 这层只做粗粒度防洪。
    location /api/ {
        limit_req zone=smsapi burst=10 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:18620;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";

        # 渲染需要真浏览器，冷启动可能到 15s，超时给到 40s
        proxy_connect_timeout 5s;
        proxy_send_timeout 40s;
        proxy_read_timeout 40s;

        # 接口响应一律不缓存
        proxy_buffering off;
        add_header Cache-Control "no-store" always;
    }

    # 后端健康检查不暴露给公网（只供本机监控）
    location = /healthz {
        return 404;
    }

    # ---- 干净 URL 重写（§4 信息架构）----
    # 无参数页面：内部重写到对应 .html
    location = /numbers { try_files /numbers.html =404; }
    location = /guide   { try_files /guide.html  =404; }
    location = /faq     { try_files /faq.html    =404; }
    location = /admin   { try_files /admin.html  =404; }

    # 国家页：优先直出预渲染静态页（/country/us -> /country/us.html）
    # 这是给 Google 抓的：正文、H1、号码列表全部在原始 HTML 源码里，无需执行 JS。
    # try_files 会先找 /country/us.html，找不到再找 /country/us/，最后回落到 JS 动态页。
    location ~ "^/country/(?<ciso>[A-Za-z]+)/?$" {
        try_files /country/$ciso.html /country.html?c=$ciso =404;
    }

    # 号码详情页没有静态版本，保持动态
    location ~ "^/number/(.+)$" {
        return 302 /number.html?id=$1;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # HTML 不缓存，改版即时生效
    location ~* \.html$ {
        add_header Cache-Control "no-cache, must-revalidate" always;
        expires -1;
    }

    # 静态资源短缓存（改版后最多 5 分钟生效）
    location /assets/ {
        add_header Cache-Control "public, max-age=300" always;
        access_log off;
    }

    access_log /var/log/nginx/sms-hub.access.log;
    error_log /var/log/nginx/sms-hub.error.log;
}
