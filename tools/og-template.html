<!DOCTYPE html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1200px;height:630px;overflow:hidden;background:#070B12;
  font-family:"Segoe UI","Microsoft YaHei",system-ui,sans-serif}
.wrap{position:relative;width:1200px;height:630px;display:flex;align-items:center;gap:56px;padding:0 72px}
.bg{position:absolute;inset:0;overflow:hidden}
.bg img{width:100%;height:100%;object-fit:cover;opacity:.42}
.veil{position:absolute;inset:0;background:linear-gradient(90deg,#070B12 0%,rgba(7,11,18,.92) 46%,rgba(7,11,18,.35) 100%)}
.left{position:relative;z-index:2;flex:1;max-width:620px}
.logo{height:64px;width:auto;margin-bottom:30px}
h1{font-size:60px;line-height:1.14;font-weight:800;color:#F8FAFC;letter-spacing:-.025em;margin-bottom:22px}
h1 em{font-style:normal;background:linear-gradient(92deg,#4F7FFF,#2DD4A8);-webkit-background-clip:text;background-clip:text;color:transparent}
p{font-size:25px;line-height:1.5;color:#94A3B8;font-weight:500}
.tags{display:flex;gap:14px;margin-top:34px}
.tag{padding:11px 22px;border-radius:999px;background:rgba(79,127,255,.14);
  border:1px solid rgba(79,127,255,.35);color:#9DB6FF;font-size:20px;font-weight:700}
.tag.g{background:rgba(45,212,168,.13);border-color:rgba(45,212,168,.35);color:#7FE6C9}
.right{position:relative;z-index:2;flex:none}
.right img{height:470px;width:auto;filter:drop-shadow(0 24px 50px rgba(0,0,0,.55))}
</style></head><body>
<div class="wrap">
  <div class="bg"><img src="HERO"></div>
  <div class="veil"></div>
  <div class="left">
    <img class="logo" src="LOGO" alt="">
    <h1>免费在线<em>接码</em><br>接收短信验证码</h1>
    <p>覆盖 23 个国家 · 700+ 个临时号码<br>短信实时刷新 · 验证码自动识别</p>
    <div class="tags"><span class="tag">无需注册</span><span class="tag g">复制即用</span></div>
  </div>
  <div class="right"><img src="PHONE" alt=""></div>
</div>
</body></html>
