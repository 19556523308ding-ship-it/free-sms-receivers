<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>全部可用号码 - 免费接码 | SMS Hub</title>
<meta name="description" content="浏览全部站内可直接接收短信的免费临时号码，按国家、状态、活跃度筛选，复制即可使用。">
<meta name="theme-color" content="#070B12">
<meta name="robots" content="noindex,follow">
<link rel="icon" href="assets/brand/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/brand/favicon.svg">
<link rel="stylesheet" href="assets/app.css">
<style>
.pt{padding:34px 0 8px}
.pt h1{font-size:30px;margin:0 0 8px;font-weight:800;letter-spacing:-.02em}
.pt p{color:var(--text-muted);margin:0;font-size:14.5px}
.pt p b{color:var(--accent)}

.bar{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  padding:16px 0;position:sticky;top:var(--header-h);z-index:40;
  background:rgba(7,11,18,.9);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border);margin-bottom:22px;
}
.bar .grow{flex:1}
.search.mini{height:38px;padding:0 12px;max-width:280px;flex:1 1 200px}
.search.mini input{font-size:13.5px}
.res{font-size:13px;color:var(--text-muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.res b{color:var(--text)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.chip{
  display:inline-flex;align-items:center;gap:7px;padding:5px 6px 5px 12px;border-radius:var(--r-pill);
  background:rgba(79,127,255,.13);border:1px solid rgba(79,127,255,.34);font-size:12.5px;color:var(--text);
}
.chip button{width:19px;height:19px;border-radius:50%;border:0;background:rgba(255,255,255,.12);color:var(--text);cursor:pointer;line-height:1;font-size:12px;display:flex;align-items:center;justify-content:center}
.chip button:hover{background:rgba(255,255,255,.24)}

.more{display:flex;justify-content:center;padding:26px 0 6px}

/* 移动端筛选面板 (§9 Bottom Sheet) */
.sheet-mask{position:fixed;inset:0;background:rgba(0,0,0,.62);z-index:120;opacity:0;pointer-events:none;transition:opacity .22s}
.sheet-mask.on{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:130;background:var(--surface);
  border-radius:var(--r-modal) var(--r-modal) 0 0;border-top:1px solid var(--border-strong);
  padding:20px 18px max(20px,env(safe-area-inset-bottom));
  transform:translateY(102%);transition:transform .26s cubic-bezier(.2,.8,.3,1);
}
.sheet.on{transform:none}
.sheet h3{margin:0 0 16px;font-size:16px}
.fld{margin-bottom:15px}
.fld label{display:block;font-size:12.5px;color:var(--text-muted);margin-bottom:7px;font-weight:600}
.fld select{width:100%}
.sheet-btns{display:flex;gap:10px;margin-top:20px}
.sheet-btns .btn{flex:1}

@media (max-width:767px){
  .pt{padding:24px 0 6px}
  .pt h1{font-size:22px}
  .bar{gap:8px;padding:12px 0}
  .bar .d-only{display:none}
  .search.mini{display:none}
  .bar .grow{display:none}
  .bar .m-ob{display:inline-flex}
}
.m-ob{display:none}
</style>
</head>
<body>
<header class="hd" id="hd"></header>

<main class="wrap">
  <div class="pt">
    <h1 id="ptTitle">全部可用号码</h1>
    <p id="ptSub">正在载入…</p>
  </div>

  <div class="bar">
    <form class="search mini" id="sForm" role="search" autocomplete="off">
      <span class="ic">🔍</span>
      <input id="q" type="search" placeholder="搜索国家或区号…" aria-label="搜索国家或区号">
    </form>
    <select class="sel d-only" id="fCountry" aria-label="按国家筛选"><option value="">全部国家</option></select>
    <select class="sel d-only" id="fStatus" aria-label="按状态筛选">
      <option value="">全部状态</option>
      <option value="available">可用</option>
      <option value="low_usage">较少使用</option>
      <option value="unverified">暂未验证</option>
    </select>
    <select class="sel d-only" id="fSort" aria-label="排序方式">
      <option value="rank">推荐优先</option>
      <option value="recent">最近收录</option>
      <option value="sms">短信最多</option>
      <option value="country">按国家</option>
    </select>
    <select class="sel d-only" id="fPool" aria-label="号码池">
      <option value="main">站内可收短信</option>
      <option value="all">含仅跳原站</option>
    </select>
    <button class="btn btn-sm m-ob" id="openSheet" type="button">筛选</button>
    <div class="grow"></div>
    <span class="res" id="res"></span>
  </div>

  <div class="chips" id="chips"></div>
  <div class="numgrid" id="grid"></div>
  <div class="more" id="moreBox"></div>
  <div id="stateBox"></div>
</main>

<footer class="ft" id="ft"></footer>
<nav class="bnav" id="bnav" aria-label="底部导航"></nav>

<div class="sheet-mask" id="mask"></div>
<section class="sheet" id="sheet" aria-modal="true" role="dialog" aria-labelledby="sheetTitle">
  <h3 id="sheetTitle">筛选号码</h3>
  <div class="fld"><label for="sCountry">国家</label><select class="sel" id="sCountry"><option value="">全部国家</option></select></div>
  <div class="fld"><label for="sStatus">状态</label><select class="sel" id="sStatus">
    <option value="">全部状态</option><option value="available">可用</option>
    <option value="low_usage">较少使用</option><option value="unverified">暂未验证</option></select></div>
  <div class="fld"><label for="sPool">号码池</label><select class="sel" id="sPool">
    <option value="main">站内可收短信</option><option value="all">含仅跳原站</option></select></div>
  <div class="fld"><label for="sSort">排序</label><select class="sel" id="sSort">
    <option value="rank">推荐优先</option><option value="recent">最近收录</option>
    <option value="sms">短信最多</option><option value="country">按国家</option></select></div>
  <div class="sheet-btns">
    <button class="btn" id="sheetClear" type="button">清空</button>
    <button class="btn btn-primary" id="sheetApply" type="button">应用筛选</button>
  </div>
</section>

<script type="module">
import {
  loadData, countriesOf, matchCountry, mainPool, sparePool, rank, scoreOf, isDirect, esc, flagImg,
  fmtPhone, statusHtml, statusLine, smsLine, toast, renderChrome, renderFooter, bindCopyButtons
, fillIcons } from './assets/app.js';

renderChrome('numbers');
renderFooter();
fillIcons();
bindCopyButtons();

const $ = s => document.querySelector(s);
const PAGE = 60;
let DATA = null, CTYS = [], LIST = [], SHOWN = PAGE;
const F = { country: '', status: '', sort: 'rank', pool: 'main', q: '' };

/* URL 预置 */
const sp = new URLSearchParams(location.search);
if (sp.get('c')) F.country = sp.get('c');
if (sp.get('q')) F.q = sp.get('q');
if (sp.get('pool') === 'spare') F.pool = 'all';

function pool() {
  if (F.pool === 'all') return DATA.numbers.slice();
  return mainPool(DATA);
}

function apply() {
  let list = pool();
  if (F.country) list = list.filter(n => n.countryCode === F.country);
  if (F.status) list = list.filter(n => (n.status || 'unverified') === F.status);
  if (F.q) {
    const q = F.q.trim().toLowerCase();
    const digits = q.replace(/[\s()\-+]/g, '');
    const ctyHit = new Set(CTYS.filter(c => matchCountry(c, q)).map(c => c.iso));
    const isNum = /^\d+$/.test(digits);
    list = list.filter(n => {
      if (ctyHit.has(n.countryCode)) return true;
      if (isNum) {
        const bare = String(n.phone).replace(/\D/g, '');
        return bare.startsWith(digits) || String(n.callingCode) === digits;
      }
      return (n.countryNameZh || '').toLowerCase().includes(q)
        || (n.countryNameEn || '').toLowerCase().includes(q);
    });
  }
  const s = F.sort;
  if (s === 'rank') list = rank(list);
  else if (s === 'sms') list.sort((a, b) => (b.messageCount || b.smsToday || 0) - (a.messageCount || a.smsToday || 0));
  else if (s === 'country') list.sort((a, b) => (a.countryNameZh || '').localeCompare(b.countryNameZh || '', 'zh') || String(a.phone).localeCompare(String(b.phone)));
  else list.sort((a, b) => new Date(b.collectedAt || 0) - new Date(a.collectedAt || 0));
  return list;
}

function cardHtml(n) {
  const shown = fmtPhone(n.phone, n.callingCode);
  const direct = isDirect(n);
  return `<article class="ncard">
    <div class="ncard-top">
      <div class="ncard-ctry">${flagImg(n.countryCode)}<span class="nm">${esc(n.countryNameZh)}</span></div>
      ${direct ? statusHtml(n) : `<span class="st st-unverified" title="仅可跳转原站查看">仅跳原站</span>`}
    </div>
    <div class="ncard-phone">
      <span class="val mono" title="${esc(n.phone)}">${esc(shown)}</span>
      <button class="cp" data-phone="${esc(n.phone)}" data-ic="copy" aria-label="复制号码 ${esc(n.phone)}" title="复制号码"></button>
    </div>
    <div class="ncard-meta">
      <span>${direct ? esc(statusLine(n)) : '站内暂不支持查看'}</span><span class="sep">·</span><span>${smsLine(n)}</span>
    </div>
    <div class="ncard-foot">
      ${direct
        ? `<a class="btn btn-primary btn-sm" href="number.html?id=${encodeURIComponent(n.id)}">使用此号码 <span data-ic="arrow-right"></span></a>`
        : `<a class="btn btn-sm" href="${esc(n.sourceUrl)}" target="_blank" rel="noopener nofollow">前往原站查看 ↗</a>`}
    </div>
  </article>`;
}

function renderChips() {
  const c = [];
  if (F.country) {
    const cc = CTYS.find(x => x.iso === F.country);
    c.push(['country', '国家：' + (cc ? cc.nameZh : F.country)]);
  }
  if (F.status) c.push(['status', '状态：' + ({ available: '可用', low_usage: '较少使用', unverified: '暂未验证' }[F.status])]);
  if (F.pool === 'all') c.push(['pool', '含仅跳原站']);
  if (F.q) c.push(['q', '搜索：' + F.q]);
  const box = $('#chips');
  box.innerHTML = c.map(([k, t]) => `<span class="chip">${esc(t)}<button data-k="${k}" aria-label="移除筛选">×</button></span>`).join('');
  box.querySelectorAll('button').forEach(b => {
    b.onclick = () => {
      const k = b.dataset.k;
      if (k === 'q') { F.q = ''; $('#q').value = ''; }
      else if (k === 'pool') F.pool = 'main';
      else F[k] = '';
      SHOWN = PAGE; render();
    };
  });
}

function render() {
  if (!DATA) return;
  LIST = apply();
  const totalDirect = mainPool(DATA).length;

  $('#ptTitle').textContent = F.pool === 'all' ? '全部号码' : '全部可用号码';
  $('#ptSub').innerHTML = F.pool === 'all'
    ? `全部 <b>${DATA.numbers.length}</b> 个号码，其中 <b>${totalDirect}</b> 个可在站内接收短信`
    : `<b>${totalDirect}</b> 个站内可直接接收短信的号码 · 无需注册，复制即可使用`;

  const base = pool().length;
  $('#res').innerHTML = LIST.length === base
    ? `共 <b>${LIST.length}</b> 个`
    : `<b>${LIST.length}</b> / ${base} 个`;

  renderChips();

  if (!LIST.length) {
    $('#grid').innerHTML = '';
    $('#moreBox').innerHTML = '';
    $('#stateBox').innerHTML = `<div class="state"><img class="state-art" src="assets/empty/empty-search.svg" alt="" width="150" height="120"><h3>没有匹配的号码</h3>
      <p>换个国家或清空筛选条件再试试。</p><button class="btn btn-primary" id="resetAll">清除筛选</button></div>`;
    const rb = $('#resetAll');
    if (rb) rb.onclick = () => { F.country = F.status = F.q = ''; F.pool = 'main'; F.sort = 'rank'; $('#q').value = ''; SHOWN = PAGE; render(); };
    return;
  }
  $('#stateBox').innerHTML = '';
  const slice = LIST.slice(0, SHOWN);
  $('#grid').innerHTML = slice.map(cardHtml).join('');
  fillIcons($('#grid'));
  $('#moreBox').innerHTML = LIST.length > SHOWN
    ? `<button class="btn" id="moreBtn">加载更多（还有 ${LIST.length - SHOWN} 个）</button>`
    : `<span style="font-size:13px;color:var(--text-dim)">已显示全部 ${LIST.length} 个号码</span>`;
  const mb = $('#moreBtn');
  if (mb) mb.onclick = () => { SHOWN += PAGE; render(); };
}

function buildCountrySelects() {
  const list = CTYS.slice().sort((a, b) => b.directInbox - a.directInbox || b.total - a.total || a.nameZh.localeCompare(b.nameZh, 'zh'));
  const opts = '<option value="">全部国家</option>' + list.map(c =>
    `<option value="${esc(c.iso)}">${esc(c.nameZh)}${c.directInbox ? ' (' + c.directInbox + ')' : ''}</option>`).join('');
  $('#fCountry').innerHTML = opts;
  $('#sCountry').innerHTML = opts;
}

/* ---------- 事件 ---------- */
let tmr;
$('#q').addEventListener('input', e => {
  F.q = e.target.value;
  clearTimeout(tmr);
  tmr = setTimeout(() => { SHOWN = PAGE; render(); }, 180);
});
$('#sForm').addEventListener('submit', e => { e.preventDefault(); SHOWN = PAGE; render(); });

const syncSel = () => {
  $('#fCountry').value = F.country; $('#fStatus').value = F.status;
  $('#fSort').value = F.sort; $('#fPool').value = F.pool;
  $('#sCountry').value = F.country; $('#sStatus').value = F.status;
  $('#sPool').value = F.pool; $('#sSort').value = F.sort;
};
$('#fCountry').onchange = e => { F.country = e.target.value; SHOWN = PAGE; syncSel(); render(); };
$('#fStatus').onchange = e => { F.status = e.target.value; SHOWN = PAGE; syncSel(); render(); };
$('#fSort').onchange = e => { F.sort = e.target.value; SHOWN = PAGE; syncSel(); render(); };
$('#fPool').onchange = e => { F.pool = e.target.value; SHOWN = PAGE; syncSel(); render(); };

const sheet = $('#sheet'), mask = $('#mask');
let lastFocus = null;
const openSheet = () => { lastFocus = document.activeElement; syncSel(); sheet.classList.add('on'); mask.classList.add('on'); $('#sheetApply').focus(); };
const closeSheet = () => { sheet.classList.remove('on'); mask.classList.remove('on'); if (lastFocus) lastFocus.focus(); };
$('#openSheet').onclick = openSheet;
mask.onclick = closeSheet;
$('#sheetApply').onclick = () => {
  F.country = $('#sCountry').value; F.status = $('#sStatus').value;
  F.pool = $('#sPool').value; F.sort = $('#sSort').value;
  SHOWN = PAGE; closeSheet(); syncSel(); render();
};
$('#sheetClear').onclick = () => {
  $('#sCountry').value = ''; $('#sStatus').value = ''; $('#sPool').value = 'main'; $('#sSort').value = 'rank';
};
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && sheet.classList.contains('on')) closeSheet();
});

/* ---------- 启动 ---------- */
(async () => {
  $('#grid').innerHTML = Array.from({ length: 6 }, () => '<div class="skel"></div>').join('');
  try {
    DATA = await loadData();
    CTYS = countriesOf(DATA);
    buildCountrySelects();
    syncSel();
    if (F.q) $('#q').value = F.q;
    render();
  } catch (err) {
    $('#grid').innerHTML = '';
    $('#ptSub').textContent = '数据加载失败';
    $('#stateBox').innerHTML = `<div class="state"><img class="state-art" src="assets/empty/empty-error.svg" alt="" width="150" height="120"><h3>数据加载失败</h3>
      <p>${esc(err.message)}</p><button class="btn btn-primary" id="retry">重试</button></div>`;
    const rb = $('#retry'); if (rb) rb.onclick = () => location.reload();
  }
})();
</script>
</body>
</html>
