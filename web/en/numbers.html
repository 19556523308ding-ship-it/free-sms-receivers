<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>All Free Temporary Numbers — Filter by Country | SMS Hub</title>
<meta name="description" content="Browse every free temporary number whose SMS can be read directly on this site. Filter by country, calling code, status and activity, then copy a number to receive SMS verification codes online in real time.">
<meta name="theme-color" content="#070B12">
<link rel="icon" href="/assets/brand/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/assets/brand/favicon.svg">
<link rel="stylesheet" href="/assets/app.css">
<style>
.pt{padding:34px 0 8px}
.pt h1{font-size:30px;margin:0 0 8px;font-weight:800;letter-spacing:-.02em}
.pt p{color:var(--text-muted);margin:0;font-size:14.5px}
.pt p b{color:var(--accent)}

.bar{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  padding:16px 0;position:sticky;top:var(--header-h);z-index:40;
  background:rgba(7,11,18,.9);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border);margin-bottom:22px;
}
.bar .grow{flex:1}
.search.mini{height:38px;padding:0 12px;max-width:280px;flex:1 1 200px}
.search.mini input{font-size:13.5px}
.res{font-size:13px;color:var(--text-muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.res b{color:var(--text)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.chip{
  display:inline-flex;align-items:center;gap:7px;padding:5px 6px 5px 12px;border-radius:var(--r-pill);
  background:rgba(79,127,255,.13);border:1px solid rgba(79,127,255,.34);font-size:12.5px;color:var(--text);
}
.chip button{width:19px;height:19px;border-radius:50%;border:0;background:rgba(255,255,255,.12);color:var(--text);cursor:pointer;line-height:1;font-size:12px;display:flex;align-items:center;justify-content:center}
.chip button:hover{background:rgba(255,255,255,.24)}

.more{display:flex;justify-content:center;padding:26px 0 6px}

/* 移动端筛选面板 (§9 Bottom Sheet) */
.sheet-mask{position:fixed;inset:0;background:rgba(0,0,0,.62);z-index:120;opacity:0;pointer-events:none;transition:opacity .22s}
.sheet-mask.on{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:130;background:var(--surface);
  border-radius:var(--r-modal) var(--r-modal) 0 0;border-top:1px solid var(--border-strong);
  padding:20px 18px max(20px,env(safe-area-inset-bottom));
  transform:translateY(102%);transition:transform .26s cubic-bezier(.2,.8,.3,1);
}
.sheet.on{transform:none}
.sheet h3{margin:0 0 16px;font-size:16px}
.fld{margin-bottom:15px}
.fld label{display:block;font-size:12.5px;color:var(--text-muted);margin-bottom:7px;font-weight:600}
.fld select{width:100%}
.sheet-btns{display:flex;gap:10px;margin-top:20px}
.sheet-btns .btn{flex:1}

@media (max-width:767px){
  .pt{padding:24px 0 6px}
  .pt h1{font-size:22px}
  .bar{gap:8px;padding:12px 0}
  .bar .d-only{display:none}
  .search.mini{display:none}
  .bar .grow{display:none}
  .bar .m-ob{display:inline-flex}
}
.m-ob{display:none}
</style>
<!--en:block-->
<link rel="canonical" href="https://sms.jinzhai.icu/en/numbers">
<link rel="alternate" hreflang="zh-CN" href="https://sms.jinzhai.icu/numbers">
<link rel="alternate" hreflang="zh-Hans" href="https://sms.jinzhai.icu/numbers">
<link rel="alternate" hreflang="en" href="https://sms.jinzhai.icu/en/numbers">
<link rel="alternate" hreflang="x-default" href="https://sms.jinzhai.icu/numbers">
<meta name="robots" content="index,follow">
<meta property="og:type" content="website">
<meta property="og:site_name" content="SMS Hub">
<meta property="og:locale" content="en_US">
<meta property="og:url" content="https://sms.jinzhai.icu/en/numbers">
<meta property="og:title" content="All Free Temporary Numbers | SMS Hub">
<meta property="og:description" content="Filter free temporary numbers by country and activity, then copy to receive SMS codes.">
<meta property="og:image" content="https://sms.jinzhai.icu/assets/backgrounds/og-cover.png">

<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="All Free Temporary Numbers | SMS Hub">

<script type="application/ld+json">{"@context":"https://schema.org","@type":"BreadcrumbList","itemListElement":[{"@type":"ListItem","position":1,"name":"Home","item":"https://sms.jinzhai.icu/en/"},{"@type":"ListItem","position":2,"name":"All numbers","item":"https://sms.jinzhai.icu/en/numbers"}]}</script>
</head>
<body>
<header class="hd" id="hd"></header>

<main class="wrap">
  <div class="pt">
    <h1 id="ptTitle" data-i18n="numbers.h1">All available numbers</h1>
    <p id="ptSub" data-i18n="numbers.loading">Loading…</p>
  </div>

  <div class="bar">
    <form class="search mini" id="sForm" role="search" autocomplete="off">
      <span class="ic">🔍</span>
      <input id="q" type="search" placeholder="搜索国家或区号…" aria-label="搜索国家或区号">
    </form>
    <select class="sel d-only" id="fCountry" aria-label="按国家筛选"><option value="">全部国家</option></select>
    <select class="sel d-only" id="fStatus" aria-label="按状态筛选">
      <option value="">全部状态</option>
      <option value="available">可用</option>
      <option value="low_usage">较少使用</option>
      <option value="unverified">暂未验证</option>
    </select>
    <select class="sel d-only" id="fSort" aria-label="排序方式">
      <option value="rank">推荐优先</option>
      <option value="recent">最近收录</option>
      <option value="sms">短信最多</option>
      <option value="country">按国家</option>
    </select>
    <select class="sel d-only" id="fPool" aria-label="号码池">
      <option value="main">站内可收短信</option>
      <option value="all">含仅跳原站</option>
    </select>
    <button class="btn btn-sm m-ob" id="openSheet" type="button" data-i18n="numbers.filterBtn">Filters</button>
    <div class="grow"></div>
    <span class="res" id="res"></span>
  </div>

  <div class="chips" id="chips"></div>
  <div class="numgrid" id="grid"></div>
  <div class="more" id="moreBox"></div>
  <div id="stateBox"></div>
</main>

<footer class="ft" id="ft"></footer>
<nav class="bnav" id="bnav" aria-label="底部导航"></nav>

<div class="sheet-mask" id="mask"></div>
<section class="sheet" id="sheet" aria-modal="true" role="dialog" aria-labelledby="sheetTitle">
  <h3 id="sheetTitle" data-i18n="numbers.filterTitle">Filter numbers</h3>
  <div class="fld"><label for="sCountry" data-i18n="numbers.filterCountry">Country</label><select class="sel" id="sCountry"><option value="">全部国家</option></select></div>
  <div class="fld"><label for="sStatus" data-i18n="numbers.filterStatus">Status</label><select class="sel" id="sStatus">
    <option value="">全部状态</option><option value="available">可用</option>
    <option value="low_usage">较少使用</option><option value="unverified">暂未验证</option></select></div>
  <div class="fld"><label for="sPool" data-i18n="numbers.filterPool">Pool</label><select class="sel" id="sPool">
    <option value="main">站内可收短信</option><option value="all">含仅跳原站</option></select></div>
  <div class="fld"><label for="sSort" data-i18n="numbers.sortBy">Sort</label><select class="sel" id="sSort">
    <option value="rank">推荐优先</option><option value="recent">最近收录</option>
    <option value="sms">短信最多</option><option value="country">按国家</option></select></div>
  <div class="sheet-btns">
    <button class="btn" id="sheetClear" type="button" data-i18n="numbers.filterClear">Clear</button>
    <button class="btn btn-primary" id="sheetApply" type="button" data-i18n="numbers.filterApply">Apply filters</button>
  </div>
</section>

<script type="module">
import {
  loadData, countriesOf, matchCountry, mainPool, sparePool, rank, scoreOf, isDirect, esc, flagImg,
  fmtPhone, statusHtml, statusLine, smsLine, toast, renderChrome, renderFooter, bindCopyButtons,
  fillIcons, t, page, IS_EN, num, countryName
} from '/assets/app.js';

renderChrome('numbers');
renderFooter();
fillIcons();
bindCopyButtons();
applyStaticI18n();

/* 静态 HTML 文案本地化 */
function applyStaticI18n() {
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
  const q = document.getElementById('q');
  if (q) { q.placeholder = t('nav.searchPlaceholder'); q.setAttribute('aria-label', t('home.searchLabel')); }
  const bn = document.querySelector('.bnav'); if (bn) bn.setAttribute('aria-label', t('nav.bottomNav'));
  // 下拉框选项本地化（值与 JS 逻辑绑定，文本才翻译）
  const map = {
    fStatus:  [['', 'numbers.allStatus'], ['available', 'status.available'], ['low_usage', 'status.low_usage'], ['unverified', 'status.unverified']],
    sStatus:  [['', 'numbers.allStatus'], ['available', 'status.available'], ['low_usage', 'status.low_usage'], ['unverified', 'status.unverified']],
    fSort:    [['rank', 'numbers.sortRecommended'], ['recent', 'numbers.sortRecent'], ['sms', 'numbers.sortSms'], ['country', 'numbers.sortCountry']],
    sSort:    [['rank', 'numbers.sortRecommended'], ['recent', 'numbers.sortRecent'], ['sms', 'numbers.sortSms'], ['country', 'numbers.sortCountry']],
    fPool:    [['main', 'numbers.poolMain'], ['all', 'numbers.poolAll']],
    sPool:    [['main', 'numbers.poolMain'], ['all', 'numbers.poolAll']],
  };
  for (const id in map) {
    const el = document.getElementById(id);
    if (!el) continue;
    el.querySelectorAll('option').forEach(o => {
      const hit = map[id].find(([v]) => v === o.value);
      if (hit) o.textContent = t(hit[1]);
    });
  }
}

const $ = s => document.querySelector(s);
const PAGE = 60;
let DATA = null, CTYS = [], LIST = [], SHOWN = PAGE;
const F = { country: '', status: '', sort: 'rank', pool: 'main', q: '' };

/* URL 预置 */
const sp = new URLSearchParams(location.search);
if (sp.get('c')) F.country = sp.get('c');
if (sp.get('q')) F.q = sp.get('q');
if (sp.get('pool') === 'spare') F.pool = 'all';

function pool() {
  if (F.pool === 'all') return DATA.numbers.slice();
  return mainPool(DATA);
}

function apply() {
  let list = pool();
  if (F.country) list = list.filter(n => n.countryCode === F.country);
  if (F.status) list = list.filter(n => (n.status || 'unverified') === F.status);
  if (F.q) {
    const q = F.q.trim().toLowerCase();
    const digits = q.replace(/[\s()\-+]/g, '');
    const ctyHit = new Set(CTYS.filter(c => matchCountry(c, q)).map(c => c.iso));
    const isNum = /^\d+$/.test(digits);
    list = list.filter(n => {
      if (ctyHit.has(n.countryCode)) return true;
      if (isNum) {
        const bare = String(n.phone).replace(/\D/g, '');
        return bare.startsWith(digits) || String(n.callingCode) === digits;
      }
      return (n.countryNameZh || '').toLowerCase().includes(q)
        || (n.countryNameEn || '').toLowerCase().includes(q);
    });
  }
  const s = F.sort;
  if (s === 'rank') list = rank(list);
  else if (s === 'sms') list.sort((a, b) => (b.messageCount || b.smsToday || 0) - (a.messageCount || a.smsToday || 0));
  else if (s === 'country') list.sort((a, b) => countryName(a).localeCompare(countryName(b), IS_EN ? 'en' : 'zh') || String(a.phone).localeCompare(String(b.phone)));
  else list.sort((a, b) => new Date(b.collectedAt || 0) - new Date(a.collectedAt || 0));
  return list;
}

function cardHtml(n) {
  const shown = fmtPhone(n.phone, n.callingCode);
  const direct = isDirect(n);
  return `<article class="ncard">
    <div class="ncard-top">
      <div class="ncard-ctry">${flagImg(n.countryCode)}<span class="nm">${esc(countryName(n))}</span></div>
      ${direct ? statusHtml(n) : `<span class="st st-unverified" title="${esc(t('numbers.notReadableHere'))}">${esc(t('numbers.jumpOnly'))}</span>`}
    </div>
    <div class="ncard-phone">
      <span class="val mono" title="${esc(n.phone)}">${esc(shown)}</span>
      <button class="cp" data-phone="${esc(n.phone)}" data-ic="copy" aria-label="${esc(t('common.copyNumber'))} ${esc(n.phone)}" title="${esc(t('common.copyNumber'))}"></button>
    </div>
    <div class="ncard-meta">
      <span>${direct ? esc(statusLine(n)) : esc(t('numbers.notReadableHere'))}</span><span class="sep">·</span><span>${smsLine(n)}</span>
    </div>
    <div class="ncard-foot">
      ${direct
        ? `<a class="btn btn-primary btn-sm" href="${page('number')}?id=${encodeURIComponent(n.id)}">${esc(t('common.useNumber'))} <span data-ic="arrow-right"></span></a>`
        : `<a class="btn btn-sm" href="${esc(n.sourceUrl)}" target="_blank" rel="noopener nofollow">${esc(t('numbers.goSource'))}</a>`}
    </div>
  </article>`;
}

function renderChips() {
  const c = [];
  if (F.country) {
    const cc = CTYS.find(x => x.iso === F.country);
    c.push(['country', t('numbers.chipCountry', { v: cc ? countryName(cc) : F.country })]);
  }
  if (F.status) c.push(['status', t('numbers.chipStatus', { v: t('status.' + F.status) })]);
  if (F.pool === 'all') c.push(['pool', t('numbers.chipPool')]);
  if (F.q) c.push(['q', t('numbers.chipQ', { v: F.q })]);
  const box = $('#chips');
  box.innerHTML = c.map(([k, label]) => `<span class="chip">${esc(label)}<button data-k="${k}" aria-label="${esc(t('numbers.removeFilter'))}">×</button></span>`).join('');
  box.querySelectorAll('button').forEach(b => {
    b.onclick = () => {
      const k = b.dataset.k;
      if (k === 'q') { F.q = ''; $('#q').value = ''; }
      else if (k === 'pool') F.pool = 'main';
      else F[k] = '';
      SHOWN = PAGE; render();
    };
  });
}

function render() {
  if (!DATA) return;
  LIST = apply();
  const totalDirect = mainPool(DATA).length;

  $('#ptTitle').textContent = F.pool === 'all' ? t('numbers.titleAll') : t('numbers.h1');
  $('#ptSub').innerHTML = F.pool === 'all'
    ? t('numbers.subAll', { n: num(DATA.numbers.length), d: num(totalDirect) })
    : t('numbers.subMain', { n: num(totalDirect) });

  const base = pool().length;
  $('#res').innerHTML = LIST.length === base
    ? t('numbers.resAll', { n: num(LIST.length) })
    : t('numbers.resFiltered', { n: num(LIST.length), base: num(base) });

  renderChips();

  if (!LIST.length) {
    $('#grid').innerHTML = '';
    $('#moreBox').innerHTML = '';
    $('#stateBox').innerHTML = `<div class="state"><img class="state-art" src="/assets/empty/empty-search.svg" alt="" width="150" height="120"><h3>${esc(t('numbers.empty'))}</h3>
      <p>${esc(t('numbers.emptyHint2'))}</p><button class="btn btn-primary" id="resetAll">${esc(t('numbers.clearFilter'))}</button></div>`;
    const rb = $('#resetAll');
    if (rb) rb.onclick = () => { F.country = F.status = F.q = ''; F.pool = 'main'; F.sort = 'rank'; $('#q').value = ''; SHOWN = PAGE; render(); };
    return;
  }
  $('#stateBox').innerHTML = '';
  const slice = LIST.slice(0, SHOWN);
  $('#grid').innerHTML = slice.map(cardHtml).join('');
  fillIcons($('#grid'));
  $('#moreBox').innerHTML = LIST.length > SHOWN
    ? `<button class="btn" id="moreBtn">${esc(t('numbers.loadMore', { n: num(LIST.length - SHOWN) }))}</button>`
    : `<span style="font-size:13px;color:var(--text-dim)">${esc(t('numbers.allShown', { n: num(LIST.length) }))}</span>`;
  const mb = $('#moreBtn');
  if (mb) mb.onclick = () => { SHOWN += PAGE; render(); };
}

function buildCountrySelects() {
  const list = CTYS.slice().sort((a, b) => b.directInbox - a.directInbox || b.total - a.total || countryName(a).localeCompare(countryName(b), IS_EN ? 'en' : 'zh'));
  const opts = `<option value="">${esc(t('numbers.all'))}</option>` + list.map(c =>
    `<option value="${esc(c.iso)}">${esc(countryName(c))}${c.directInbox ? ' (' + c.directInbox + ')' : ''}</option>`).join('');
  $('#fCountry').innerHTML = opts;
  $('#sCountry').innerHTML = opts;
}

/* ---------- 事件 ---------- */
let tmr;
$('#q').addEventListener('input', e => {
  F.q = e.target.value;
  clearTimeout(tmr);
  tmr = setTimeout(() => { SHOWN = PAGE; render(); }, 180);
});
$('#sForm').addEventListener('submit', e => { e.preventDefault(); SHOWN = PAGE; render(); });

const syncSel = () => {
  $('#fCountry').value = F.country; $('#fStatus').value = F.status;
  $('#fSort').value = F.sort; $('#fPool').value = F.pool;
  $('#sCountry').value = F.country; $('#sStatus').value = F.status;
  $('#sPool').value = F.pool; $('#sSort').value = F.sort;
};
$('#fCountry').onchange = e => { F.country = e.target.value; SHOWN = PAGE; syncSel(); render(); };
$('#fStatus').onchange = e => { F.status = e.target.value; SHOWN = PAGE; syncSel(); render(); };
$('#fSort').onchange = e => { F.sort = e.target.value; SHOWN = PAGE; syncSel(); render(); };
$('#fPool').onchange = e => { F.pool = e.target.value; SHOWN = PAGE; syncSel(); render(); };

const sheet = $('#sheet'), mask = $('#mask');
let lastFocus = null;
const openSheet = () => { lastFocus = document.activeElement; syncSel(); sheet.classList.add('on'); mask.classList.add('on'); $('#sheetApply').focus(); };
const closeSheet = () => { sheet.classList.remove('on'); mask.classList.remove('on'); if (lastFocus) lastFocus.focus(); };
$('#openSheet').onclick = openSheet;
mask.onclick = closeSheet;
$('#sheetApply').onclick = () => {
  F.country = $('#sCountry').value; F.status = $('#sStatus').value;
  F.pool = $('#sPool').value; F.sort = $('#sSort').value;
  SHOWN = PAGE; closeSheet(); syncSel(); render();
};
$('#sheetClear').onclick = () => {
  $('#sCountry').value = ''; $('#sStatus').value = ''; $('#sPool').value = 'main'; $('#sSort').value = 'rank';
};
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && sheet.classList.contains('on')) closeSheet();
});

/* ---------- 启动 ---------- */
(async () => {
  $('#grid').innerHTML = Array.from({ length: 6 }, () => '<div class="skel"></div>').join('');
  try {
    DATA = await loadData();
    CTYS = countriesOf(DATA);
    buildCountrySelects();
    syncSel();
    if (F.q) $('#q').value = F.q;
    render();
  } catch (err) {
    $('#grid').innerHTML = '';
    $('#ptSub').textContent = t('common.loadFailed');
    $('#stateBox').innerHTML = `<div class="state"><img class="state-art" src="/assets/empty/empty-error.svg" alt="" width="150" height="120"><h3>${esc(t('common.loadFailed'))}</h3>
      <p>${esc(err.message)}</p><button class="btn btn-primary" id="retry">${esc(t('common.retry'))}</button></div>`;
    const rb = $('#retry'); if (rb) rb.onclick = () => location.reload();
  }
})();
</script>
</body>
</html>
