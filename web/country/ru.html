<body>

  <!-- 这是 /country?c=xx 的 JS 回退壳；正规国家页是预渲染的 /country/<iso>。
       这里给不支持 JS 的抓取器一个占位 H1，避免「无 H1」；JS 运行后会替换成实时标题。
       注意：noscript 内不参与脚本解析，也不会与实时块冲突。 -->
  <div class="cp-head" id="cpHead"></div>

  <div class="cp-bar">

      <button class="tab" data-s="available" role="tab" aria-selected="false"><span data-i18n="status.available">可用</span> <span class="ct" id="ctA">0</span></button>
      <button class="tab" data-s="low_usage" role="tab" aria-selected="false"><span data-i18n="status.low_usage">较少使用</span> <span class="ct" id="ctL">0</span></button>
      <button class="tab" data-s="unverified" role="tab" aria-selected="false"><span data-i18n="status.unverified">暂未验证</span> <span class="ct" id="ctU">0</span></button>

<footer class="ft" id="ft"></footer>
<nav class="bnav" id="bnav" aria-label="底部导航"></nav>

<script type="module">
import {
  loadData, countriesOf, mainPool, sparePool, rank, esc, flagImg, fmtPhone, statusHtml,
  statusLine, smsLine, copy, toast, renderChrome, renderFooter, bindCopyButtons, fillIcons,
  t, page, IS_EN, num, countryName
} from '/assets/app.js';

renderChrome('numbers');
renderFooter();
bindCopyButtons();
fillIcons();
applyStaticI18n();

function applyStaticI18n() {
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
  const tb = document.getElementById('tabs'); if (tb) tb.setAttribute('aria-label', t('country.filterAria'));
  const pb = document.getElementById('pickBtn'); if (pb) pb.setAttribute('aria-label', t('country.pickForMeAria'));
  const bn = document.querySelector('.bnav'); if (bn) bn.setAttribute('aria-label', t('nav.bottomNav'));
}

const $ = s => document.querySelector(s);
const PAGE = 60;
const sp = new URLSearchParams(location.search);
const ISO = (sp.get('c') || 'RU').toUpperCase();
const POOL = sp.get('pool') === 'spare' ? 'spare' : 'main';

let DATA = null, CTYS = [], C = null, LIST = [], SHOWN = PAGE, STATUS = '';

function renderHead() {
  const direct = C.directInbox;
  const active = C.active > 0 ? C.active : direct;
  const nm = esc(countryName(C));
  $('#cpHead').innerHTML = `
    <h2 class="cp-live">${flagImg(C.iso)}<span>${esc(t('country.liveTitle', { name: countryName(C) }))}</span></h2>
    <p>${esc(t('country.liveSub', { name: countryName(C) }))}</p>
    <div class="cp-stat">
      <div class="s"><div class="n ac">${num(direct)}</div><div class="l">${esc(t('country.statDirect'))}</div></div>
      <div class="s"><div class="n">${num(active)}</div><div class="l">${esc(t('country.statActive'))}</div></div>
      <div class="s"><div class="n">${num(C.total)}</div><div class="l">${esc(t('country.statTotal'))}</div></div>
    </div>`;
  document.title = t('country.title', { name: countryName(C), n: num(C.total) });
}

function renderList() {
  let list = STATUS ? LIST.filter(n => (n.status || 'unverified') === STATUS) : LIST;
  list = rank(list);
  const counts = { all: LIST.length, available: 0, low_usage: 0, unverified: 0 };
  LIST.forEach(n => { counts[n.status || 'unverified']++; });
  $('#ctAll').textContent = counts.all;
  $('#ctA').textContent = counts.available;
  $('#ctL').textContent = counts.low_usage;
  $('#ctU').textContent = counts.unverified;

  if (!list.length) {
    $('#grid').innerHTML = '';
    $('#moreBox').innerHTML = '';
    $('#stateBox').innerHTML = `<div class="state"><div class="ic">📭</div><h3>${esc(t('country.empty'))}</h3>
      <p>${esc(t('country.emptyHint'))}</p></div>`;
    return;
  }
  $('#stateBox').innerHTML = '';
  $('#grid').innerHTML = list.slice(0, SHOWN).map(n => {
    const shown = fmtPhone(n.phone, n.callingCode);
    const direct = n.directInbox;
    return `<article class="ncard">
      <div class="ncard-top">
        <div class="ncard-ctry">${flagImg(n.countryCode)}<span class="nm">${esc(countryName(n))}</span></div>
        ${direct ? statusHtml(n) : `<span class="st st-unverified">${esc(t('numbers.jumpOnly'))}</span>`}
      </div>
      <div class="ncard-phone">
        <span class="val mono" title="${esc(n.phone)}">${esc(shown)}</span>
        <button class="cp" data-phone="${esc(n.phone)}" data-ic="copy" aria-label="${esc(t('common.copyNumber'))} ${esc(n.phone)}" title="${esc(t('common.copyNumber'))}"></button>
      </div>
      <div class="ncard-meta">
        <span>${direct ? esc(statusLine(n)) : esc(t('numbers.notReadableHere'))}</span><span class="sep">·</span><span>${smsLine(n)}</span>
      </div>
      <div class="ncard-foot">
        ${direct
          ? `<a class="btn btn-primary btn-sm" href="${page('number')}?id=${encodeURIComponent(n.id)}">${esc(t('common.useNumber'))} <span data-ic="arrow-right"></span></a>`
          : `<a class="btn btn-sm" href="${esc(n.sourceUrl)}" target="_blank" rel="noopener nofollow">${esc(t('numbers.goSource'))}</a>`}
      </div>
    </article>`;
  }).join('');
  fillIcons($('#grid'));
  $('#moreBox').innerHTML = list.length > SHOWN
    ? `<button class="btn" id="moreBtn">${esc(t('numbers.loadMore', { n: num(list.length - SHOWN) }))}</button>`
    : `<span style="font-size:13px;color:var(--text-dim)">${esc(t('numbers.allShown', { n: num(list.length) }))}</span>`;
  const mb = $('#moreBtn');
  if (mb) mb.onclick = () => { SHOWN += PAGE; renderList(); };
}

function renderOther() {
  const others = CTYS.filter(c => c.iso !== ISO && c.total > 0 && c.directInbox > 0)
    .sort((a, b) => b.directInbox - a.directInbox).slice(0, 14);
  const spareOnly = CTYS.filter(c => c.iso !== ISO && c.total > 0 && c.directInbox === 0)
    .sort((a, b) => b.total - a.total).slice(0, 8);
  const all = others.concat(spareOnly);
  $('#ochips').innerHTML = all.map(c =>
    `<a class="ochip" href="${page('country')}?c=${encodeURIComponent(c.iso)}${c.directInbox ? '' : '&pool=spare'}">${flagImg(c.iso)}<span>${esc(countryName(c))}</span><span class="c">${c.directInbox || c.total}</span></a>`).join('')
    || `<span style="color:var(--text-dim);font-size:13px">${esc(t('country.noOthers'))}</span>`;
}

/* ---------- 事件 ---------- */
$('#tabs').querySelectorAll('.tab').forEach(b => {
  b.onclick = () => {
    STATUS = b.dataset.s;
    $('#tabs').querySelectorAll('.tab').forEach(x => x.setAttribute('aria-selected', String(x === b)));
    SHOWN = PAGE;
    renderList();
  };
});

$('#pickBtn').onclick = async () => {
  const pool = rank(LIST);
  if (!pool.length) return toast(t('common.noNumberInCountry'), 'err');
  const n = pool[Math.floor(Math.random() * Math.min(12, pool.length))];
  const ok = await copy(n.phone);
  toast(ok ? t('common.pickedCopied', { phone: n.phone }) : t('common.picked', { phone: n.phone }));
  setTimeout(() => location.href = page('number') + '?id=' + encodeURIComponent(n.id) + '&picked=1', 520);
};

/* ---------- 启动 ---------- */
(async () => {
  $('#grid').innerHTML = Array.from({ length: 6 }, () => '<div class="skel"></div>').join('');
  try {
    DATA = await loadData();
    CTYS = countriesOf(DATA);
    C = CTYS.find(c => c.iso === ISO);
    if (!C) {
      const alt = CTYS.filter(c => c.directInbox > 0)[0];
      $('#cpHead').innerHTML = `<h2 class="cp-live">${esc(t('country.notFound'))}</h2><p>${esc(t('country.notFoundHint'))}</p>`;
      $('#tabs').hidden = true; $('#pickBtn').hidden = true;
      $('#grid').innerHTML = '';
      renderOther();
      if (alt) setTimeout(() => location.replace(page('country') + '?c=' + alt.iso), 1600);
      return;
    }
    const all = DATA.numbers.filter(n => n.countryCode === ISO);
    LIST = POOL === 'spare' ? all.filter(n => !n.directInbox) : all.filter(n => n.directInbox);
    if (!LIST.length) LIST = all.filter(n => n.directInbox).length ? all.filter(n => n.directInbox) : all;
    renderHead();
    renderList();
    renderOther();
  } catch (err) {
    $('#grid').innerHTML = '';
    $('#stateBox').innerHTML = `<div class="state"><img class="state-art" src="/assets/empty/empty-error.svg" alt="" width="150" height="120"><h3>${esc(t('common.loadFailed'))}</h3>
      <p>${esc(err.message)}</p><button class="btn btn-primary" id="retry">${esc(t('common.retry'))}</button></div>`;
    const rb = $('#retry'); if (rb) rb.onclick = () => location.reload();
  }
})();
</script>
