<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>国家免费接码号码 | SMS Hub</title>
<meta name="description" content="选择该国家的免费临时号码，在线接收公开短信验证码。">
<meta name="theme-color" content="#070B12">
<link rel="icon" href="assets/brand/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/brand/favicon.svg">
<link rel="stylesheet" href="assets/app.css">
<style>
.cp-head{padding:32px 0 20px}
.cp-head .ttl{display:flex;align-items:center;gap:14px;margin-bottom:12px}
.cp-head .fl{width:46px;height:34px;border-radius:6px}
.cp-head h1{font-size:30px;margin:0;font-weight:800;letter-spacing:-.02em}
.cp-head p{color:var(--text-muted);margin:0 0 18px;font-size:14.5px;max-width:640px}
.cp-stat{display:flex;gap:26px;flex-wrap:wrap}
.cp-stat .s .n{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.cp-stat .s .n.ac{color:var(--accent)}
.cp-stat .s .l{font-size:12.5px;color:var(--text-muted)}

.cp-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:16px 0;border-bottom:1px solid var(--border);margin-bottom:22px}
.cp-bar .grow{flex:1}
.other{margin-top:44px;padding-top:28px;border-top:1px solid var(--border)}
.other h2{font-size:17px;margin:0 0 16px}
.ochips{display:flex;gap:9px;flex-wrap:wrap}
.ochip{display:inline-flex;align-items:center;gap:7px;padding:7px 13px;border-radius:var(--r-pill);
  background:var(--surface);border:1px solid var(--border);font-size:13px;color:var(--text-muted);transition:all .15s}
.ochip:hover{border-color:var(--border-strong);color:var(--text)}
.ochip .c{font-variant-numeric:tabular-nums;color:var(--text-dim);font-size:12px}
@media (max-width:767px){
  .cp-head{padding:22px 0 16px}
  .cp-head .fl{width:36px;height:27px}
  .cp-head h1{font-size:22px}
  .cp-head p{font-size:14px}
  .cp-stat{gap:20px}
  .cp-bar{padding:12px 0}
}
</style>
</head>
<body>
<header class="hd" id="hd"></header>

<main class="wrap">
  <div class="cp-head" id="cpHead"></div>

  <div class="cp-bar">
    <div class="tabs" id="tabs" role="tablist" aria-label="按状态筛选">
      <button class="tab" data-s="" role="tab" aria-selected="true">全部 <span class="ct" id="ctAll">0</span></button>
      <button class="tab" data-s="available" role="tab" aria-selected="false">可用 <span class="ct" id="ctA">0</span></button>
      <button class="tab" data-s="low_usage" role="tab" aria-selected="false">较少使用 <span class="ct" id="ctL">0</span></button>
      <button class="tab" data-s="unverified" role="tab" aria-selected="false">暂未验证 <span class="ct" id="ctU">0</span></button>
    </div>
    <div class="grow"></div>
    <button class="btn btn-sm" id="pickBtn" type="button">🎲 帮我选一个</button>
  </div>

  <div class="numgrid" id="grid"></div>
  <div class="more" id="moreBox" style="display:flex;justify-content:center;padding:26px 0 6px"></div>
  <div id="stateBox"></div>

  <section class="other" id="other">
    <h2>其他国家和地区</h2>
    <div class="ochips" id="ochips"></div>
  </section>
</main>

<footer class="ft" id="ft"></footer>
<nav class="bnav" id="bnav" aria-label="底部导航"></nav>

<script type="module">
import {
  loadData, countriesOf, mainPool, sparePool, rank, esc, flagImg, fmtPhone, statusHtml,
  statusLine, smsLine, copy, toast, renderChrome, renderFooter, bindCopyButtons, fillIcons
} from './assets/app.js';

renderChrome('numbers');
renderFooter();
bindCopyButtons();
fillIcons();

const $ = s => document.querySelector(s);
const PAGE = 60;
const sp = new URLSearchParams(location.search);
const ISO = (sp.get('c') || 'US').toUpperCase();
const POOL = sp.get('pool') === 'spare' ? 'spare' : 'main';

let DATA = null, CTYS = [], C = null, LIST = [], SHOWN = PAGE, STATUS = '';

function renderHead() {
  const direct = C.directInbox;
  const active = C.active > 0 ? C.active : direct;
  $('#cpHead').innerHTML = `
    <div class="ttl">${flagImg(C.iso)}<h1>${esc(C.nameZh)}免费接码号码</h1></div>
    <p>选择一个${esc(C.nameZh)}临时号码，免费在线接收公开短信验证码。无需注册，复制即可使用。</p>
    <div class="cp-stat">
      <div class="s"><div class="n ac">${direct}</div><div class="l">个可直接收短信</div></div>
      <div class="s"><div class="n">${active}</div><div class="l">个当前较活跃</div></div>
      <div class="s"><div class="n">${C.total}</div><div class="l">个号码总数</div></div>
    </div>`;
  document.title = `${C.nameZh}免费接码号码 - 在线接收${C.nameZh}短信验证码 | SMS Hub`;
}

function renderList() {
  let list = STATUS ? LIST.filter(n => (n.status || 'unverified') === STATUS) : LIST;
  list = rank(list);
  const counts = { all: LIST.length, available: 0, low_usage: 0, unverified: 0 };
  LIST.forEach(n => { counts[n.status || 'unverified']++; });
  $('#ctAll').textContent = counts.all;
  $('#ctA').textContent = counts.available;
  $('#ctL').textContent = counts.low_usage;
  $('#ctU').textContent = counts.unverified;

  if (!list.length) {
    $('#grid').innerHTML = '';
    $('#moreBox').innerHTML = '';
    $('#stateBox').innerHTML = `<div class="state"><div class="ic">📭</div><h3>该分类下暂无可展示的号码</h3>
      <p>换个状态分类看看，或返回全部号码。</p></div>`;
    return;
  }
  $('#stateBox').innerHTML = '';
  $('#grid').innerHTML = list.slice(0, SHOWN).map(n => {
    const shown = fmtPhone(n.phone, n.callingCode);
    const direct = n.directInbox;
    return `<article class="ncard">
      <div class="ncard-top">
        <div class="ncard-ctry">${flagImg(n.countryCode)}<span class="nm">${esc(n.countryNameZh)}</span></div>
        ${direct ? statusHtml(n) : '<span class="st st-unverified">仅跳原站</span>'}
      </div>
      <div class="ncard-phone">
        <span class="val mono" title="${esc(n.phone)}">${esc(shown)}</span>
        <button class="cp" data-phone="${esc(n.phone)}" data-ic="copy" aria-label="复制号码 ${esc(n.phone)}" title="复制号码"></button>
      </div>
      <div class="ncard-meta">
        <span>${direct ? esc(statusLine(n)) : '站内暂不支持查看'}</span><span class="sep">·</span><span>${smsLine(n)}</span>
      </div>
      <div class="ncard-foot">
        ${direct
          ? `<a class="btn btn-primary btn-sm" href="number.html?id=${encodeURIComponent(n.id)}">使用此号码 <span data-ic="arrow-right"></span></a>`
          : `<a class="btn btn-sm" href="${esc(n.sourceUrl)}" target="_blank" rel="noopener nofollow">前往原站查看 ↗</a>`}
      </div>
    </article>`;
  }).join('');
  fillIcons($('#grid'));
  $('#moreBox').innerHTML = list.length > SHOWN
    ? `<button class="btn" id="moreBtn">加载更多（还有 ${list.length - SHOWN} 个）</button>`
    : `<span style="font-size:13px;color:var(--text-dim)">已显示全部 ${list.length} 个号码</span>`;
  const mb = $('#moreBtn');
  if (mb) mb.onclick = () => { SHOWN += PAGE; renderList(); };
}

function renderOther() {
  const others = CTYS.filter(c => c.iso !== ISO && c.total > 0 && c.directInbox > 0)
    .sort((a, b) => b.directInbox - a.directInbox).slice(0, 14);
  const spareOnly = CTYS.filter(c => c.iso !== ISO && c.total > 0 && c.directInbox === 0)
    .sort((a, b) => b.total - a.total).slice(0, 8);
  const all = others.concat(spareOnly);
  $('#ochips').innerHTML = all.map(c =>
    `<a class="ochip" href="country.html?c=${encodeURIComponent(c.iso)}${c.directInbox ? '' : '&pool=spare'}">${flagImg(c.iso)}<span>${esc(c.nameZh)}</span><span class="c">${c.directInbox || c.total}</span></a>`).join('')
    || '<span style="color:var(--text-dim);font-size:13px">暂无其他国家</span>';
}

/* ---------- 事件 ---------- */
$('#tabs').querySelectorAll('.tab').forEach(b => {
  b.onclick = () => {
    STATUS = b.dataset.s;
    $('#tabs').querySelectorAll('.tab').forEach(x => x.setAttribute('aria-selected', String(x === b)));
    SHOWN = PAGE;
    renderList();
  };
});

$('#pickBtn').onclick = async () => {
  const pool = rank(LIST);
  if (!pool.length) return toast('该国家暂无可选号码', 'err');
  const n = pool[Math.floor(Math.random() * Math.min(12, pool.length))];
  const ok = await copy(n.phone);
  toast(ok ? `已选好并复制：${n.phone}` : `已选好号码：${n.phone}`);
  setTimeout(() => location.href = 'number.html?id=' + encodeURIComponent(n.id) + '&picked=1', 520);
};

/* ---------- 启动 ---------- */
(async () => {
  $('#grid').innerHTML = Array.from({ length: 6 }, () => '<div class="skel"></div>').join('');
  try {
    DATA = await loadData();
    CTYS = countriesOf(DATA);
    C = CTYS.find(c => c.iso === ISO);
    if (!C) {
      const alt = CTYS.filter(c => c.directInbox > 0)[0];
      $('#cpHead').innerHTML = `<h1>未找到该国家</h1><p>请从下方选择其他国家。</p>`;
      $('#tabs').hidden = true; $('#pickBtn').hidden = true;
      $('#grid').innerHTML = '';
      renderOther();
      if (alt) setTimeout(() => location.replace('country.html?c=' + alt.iso), 1600);
      return;
    }
    const all = DATA.numbers.filter(n => n.countryCode === ISO);
    LIST = POOL === 'spare' ? all.filter(n => !n.directInbox) : all.filter(n => n.directInbox);
    if (!LIST.length) LIST = all.filter(n => n.directInbox).length ? all.filter(n => n.directInbox) : all;
    renderHead();
    renderList();
    renderOther();
  } catch (err) {
    $('#grid').innerHTML = '';
    $('#stateBox').innerHTML = `<div class="state"><img class="state-art" src="assets/empty/empty-error.svg" alt="" width="150" height="120"><h3>数据加载失败</h3>
      <p>${esc(err.message)}</p><button class="btn btn-primary" id="retry">重试</button></div>`;
    const rb = $('#retry'); if (rb) rb.onclick = () => location.reload();
  }
})();
</script>
</body>
</html>
